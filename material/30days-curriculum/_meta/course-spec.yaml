# 教材の仕様の正本（edu-creator 3.0 の course-spec）。章立て・1日の予算・検査に渡す値をここ1か所に置く（G10・T-3）。
# 章のタイトルは本文の最初の見出しから作った（2026-11-08）。ルートの edu-config.yaml は旧版の edu-creator が読む設定で、
# 章タイトル30件中14件が本文と食い違っている。章立ての正本はこちらにする。
# 検査: edu-creator のリポジトリを隣に置き、リポジトリの根で
#   uv run --project ../edu-creator edu-creator spec check material/30days-curriculum/_meta/course-spec.yaml
#   uv run --project ../edu-creator edu-creator check --spec material/30days-curriculum/_meta/course-spec.yaml
# budget_report_only: v2 では Day の数を変えないので、Day 予算は測って公開するだけにする（プランの U-15）
spec_version: 1
name: task-app
days: 30
learner:
  description: プログラミング未経験
  prior_code_lines_max: 100
  os:
  - windows
  - macos
budget:
  code_block_lines: 25
  copy_lines: 200
  files: 5
  minutes: 120
  new_concepts: 3
stack_profile: nextjs
app_repo: ../../..
material_dir: ..
distribution:
  formats:
  - pdf
  - zip
qa:
  budget_report_only: true
  gui_services:
  - Vercel
  no_table_days:
  - 1
  - 2
  - 3
  - 4
  real_root_files:
  - vitest.config.ts
  required_mermaid_days:
  - 4
  - 7
  - 9
  - 13
  - 16
  - 21
  - 27
  screenshot_exempt:
    00-1_学びのロードマップ.md: 学びの進め方を示すロードマップ。画面操作の手順を持たない索引の本で、撮る画面が存在しない
    00_カリキュラム目次.md: カリキュラム全体の目次。画面操作の手順を持たない索引の本で、撮る画面が存在しない
    day04_ネットに公開.md: デプロイの日。主役は Vercel の管理画面で撮れず、アプリの画面は Day 02 から変わらん
    day30_完成版を公開！.md: 公開の日。新規の画面は完成版ダッシュボードだけで、ログイン画面は Day 05 の使い回し
