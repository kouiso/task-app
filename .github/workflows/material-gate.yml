name: Material Quality Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'material/**/*.md'
      - 'README.md'
      - 'doc/SUPPORTED_ENVIRONMENTS.md'
      - '.env.example'
      - '.mise.toml'
      - '.node-version'
      # スクショだけを差し替えるPRでも Gate 2.5（md5重複検査）を起動させる（Codexレビュー指摘）。
      - 'material/**/*.png'
      - '.claude/skills/material-writing/**'
      - '.gitmodules'
      # ルール側を変えたら corpus 全体を再検査する（ルール変更で既存日が赤くなるのを
      # マージ後ではなくPR時点で気づくため）
      - '.textlintrc.json'
      - 'package.json'
      - 'scripts/curriculum-qa/**'
      - 'scripts/build-zip.sh'
      - 'scripts/scaffold-from-scratch.sh'
      - '.github/workflows/material-gate.yml'
      # scaffold 配布物。Gate 3 の check_scaffold_curriculum_alignment.py が
      # SCAFFOLD_COPY_MAP 経由でここを読むため、これらを消す/改名するPRでも
      # 起動しないと「ゲートが捕まえるはずの退行」を取り逃す（Codexレビュー指摘 PR#282）。
      - 'scripts/_lib-base/**'
      - 'scripts/_app-api-trpc/**'
      - 'scripts/_app-base/**'
      - 'scripts/_docker/**'
      - 'scripts/_prisma/**'
      - 'scripts/_seed/**'
      - 'scripts/_server-base/**'
      - 'scripts/_lib-utils/**'
      - 'scripts/_constants/**'
      - 'scripts/_trpc-base/**'
      - 'scripts/_app-components/**'
      - 'scripts/_ui-components/**'
      - 'scripts/_server-routers/**'
      # Gate 4 の check_anchor.py は、教材の `// filepath:` の値を
      # src/ prisma/ scripts/ の実ファイルへ突き合わせる。ここを絞っていると、
      # 参照先を消したり改名したりするだけのPRでワークフローが起動せず、
      # そのPRが作った参照切れをゲートが報告できない（Codexレビュー指摘 PR#333）。
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
  push:
    branches:
      - develop
      - main
    paths:
      - 'material/**/*.md'
      - 'README.md'
      - 'doc/SUPPORTED_ENVIRONMENTS.md'
      - '.env.example'
      - '.mise.toml'
      - '.node-version'
      # スクショだけを差し替えるPRでも Gate 2.5（md5重複検査）を起動させる（Codexレビュー指摘）。
      - 'material/**/*.png'
      - '.claude/skills/material-writing/**'
      - '.gitmodules'
      # ルール側を変えたら corpus 全体を再検査する（ルール変更で既存日が赤くなるのを
      # マージ後ではなくPR時点で気づくため）
      - '.textlintrc.json'
      - 'package.json'
      - 'scripts/curriculum-qa/**'
      - 'scripts/build-zip.sh'
      - 'scripts/scaffold-from-scratch.sh'
      - '.github/workflows/material-gate.yml'
      # scaffold 配布物。Gate 3 の check_scaffold_curriculum_alignment.py が
      # SCAFFOLD_COPY_MAP 経由でここを読むため、これらを消す/改名するPRでも
      # 起動しないと「ゲートが捕まえるはずの退行」を取り逃す（Codexレビュー指摘 PR#282）。
      - 'scripts/_lib-base/**'
      - 'scripts/_app-api-trpc/**'
      - 'scripts/_app-base/**'
      - 'scripts/_docker/**'
      - 'scripts/_prisma/**'
      - 'scripts/_seed/**'
      - 'scripts/_server-base/**'
      - 'scripts/_lib-utils/**'
      - 'scripts/_constants/**'
      - 'scripts/_trpc-base/**'
      - 'scripts/_app-components/**'
      - 'scripts/_ui-components/**'
      - 'scripts/_server-routers/**'
      # Gate 4 の check_anchor.py は、教材の `// filepath:` の値を
      # src/ prisma/ scripts/ の実ファイルへ突き合わせる。ここを絞っていると、
      # 参照先を消したり改名したりするだけのPRでワークフローが起動せず、
      # そのPRが作った参照切れをゲートが報告できない（Codexレビュー指摘 PR#333）。
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  sale-package-gate:
    name: 販売用ZIP初期状態チェック
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify sale package
        run: bash scripts/build-zip.sh

  vendored-skill-integrity:
    name: 執筆スキルvendoring整合性チェック
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: submodule化への退行を検出（hana652/Xamfonos再発防止）
        run: |
          echo "::group::.gitmodules に material-writing 配下のsubmoduleが無いか確認"
          if grep -q '.claude/skills/material-writing/' .gitmodules 2>/dev/null; then
            echo "::error::.gitmodules に .claude/skills/material-writing/ 配下のsubmoduleエントリが検出されました。"
            echo "hana652/Xamfonosはsubmodule未初期化による誤読バグ(2026-07-14)を受けてvendoring(直接埋め込み)に統一済みです。"
            echo "submoduleへ戻さず、ファイルを直接コピーしてください。詳細: .claude/skills/material-writing/references/ATTRIBUTION.md"
            cat .gitmodules
            exit 1
          fi
          echo "OK: .gitmodules に material-writing 配下のsubmoduleは無い"
          echo "::endgroup::"

      - name: vendoredディレクトリが空になっていないか確認
        run: |
          echo "::group::hana652/Xamfonosの中身が実在するか確認"
          fail=0
          for dir in \
            ".claude/skills/material-writing/hana652-tech-writing-pack" \
            ".claude/skills/material-writing/xamfonos-technical-writing-best-practices"; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir が存在しません"
              fail=1
              continue
            fi
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -lt 1 ]; then
              echo "::error::$dir が空です(未初期化submoduleと同じ症状)。ファイルが直接コピーされているか確認してください。"
              fail=1
            else
              echo "OK: $dir ($count ファイル)"
            fi
          done
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "::endgroup::"

  material-gate:
    name: 教材品質ゲート
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 変更ファイルのみの検査は 2026-07-15 に廃止した。
      # 理由: 変更されていないファイルは永久に検査対象外になるため、911件の違反が
      #       2026-06-30〜07-10 の11日間 corpus に滞留し、ebca2f2 が手で掃除するまで
      #       誰にも検出されなかった。これは実在するカバレッジ欠陥である。
      # 注意: これは外部レビューでの指摘(2026-06-30)の原因ではない。ゲート自体が
      #       拒否の当日(97d59f5, 2026-06-30 11:01)に生まれており、彼が読んだ教材は
      #       ゲート不在時に書かれた。因果を混同しないこと。
      # 移行コスト: ゼロ（2026-07-15 時点でフルスキャン 0 violations / 38ファイル）。

      - name: Gate 1 — 文章衛生チェック (textlint) — material/**/*.md 全体
        run: |
          echo "::group::textlint — material 配下の全 .md（変更有無を問わない）"
          # glob はシェルではなく textlint に展開させる（クォート必須）。
          # 旧実装は changed-files の出力を run: へ素のまま展開しており、
          # スペース入りファイル名で壊れ、ブランチ名経由のシェル注入面にもなっていた。
          # 注: この run: 内に GitHub Actions の式デリミタを literal で書くと、
          #     コメント内であっても評価されてワークフロー全体がパースエラーになる。
          npx textlint "material/**/*.md"
          echo "::endgroup::"

      - name: Gate 2 — 品質チェック (check_quality.sh) — day/appendix 全体
        run: |
          echo "::group::check_quality.sh — day/appendix 全件（変更有無を問わない）"
          # ディレクトリモードで呼ぶ。理由は2つ（PR#285 CodeRabbitレビュー指摘）:
          # 1. 命名規則外の md（day1_x.md 等）を検出するガードはディレクトリモードに
          #    実装されており、find でファイルを渡す旧方式ではガードが一度も走らない。
          # 2. スコープが day のみ → day+appendix に広がる（appendix も検査対象になる）。
          bash scripts/curriculum-qa/check_quality.sh material/30days-curriculum/
          echo "::endgroup::"

      - name: Gate 2.5 — スクショmd5重複チェック — screenshots/ 全体
        run: |
          echo "::group::md5 duplicate scan — 同一内容の画像が別名で存在しないか"
          # 由来: PR#285 レビュー。day09-cards.png == day09-complete.png など、
          #       同一画像が別キャプションで使い回され「キャプションと画像の整合」
          #       (voice-spec ルーブリック6) を壊していた。人手のmd5sum確認は
          #       抜けるので、重複が1組でもあれば落とす。
          dups=$(find material/30days-curriculum/screenshots -type f -name '*.png' -print0 \
            | xargs -0 -r md5sum | sort | awk '{if ($1 == prev) {print prevline; print $0} prev=$1; prevline=$0}' | sort -u)
          if [ -n "$dups" ]; then
            echo "重複スクリーンショットを検出:"
            echo "$dups"
            exit 1
          fi
          echo "重複なし"
          echo "::endgroup::"

      # Gate 3: 2026-07-15 配線。それまで書かれていたのに誰からも呼ばれていなかった。
      #
      # 【このゲートが保証すること / しないこと】
      #   保証する : 教材の @/ import が「scaffold配布物」か「day <= N の filepath ブロック」
      #              のいずれかで宣言されている（+ day順序も見る）
      #   保証しない: コンパイル・実行・アプリが動くこと。
      #              「指示通り打てば動く」の保証ではない（外部レビューの指摘事項の一つは未達）。
      #              それを見るのは typescript-docs-verifier の担当。
      #
      # 【柱3 との衝突・次セッションへの申し送り】
      #   柱3（配布ZIPを学習用/解答用に分離）は scaffold のルーターを意図的に空にする。
      #   その時点でこの不変条件は壊れる。柱3のPRが「このゲートの更新または削除」を
      #   自分の責任範囲に含めること。今は緑（EXIT 0 / All @/ imports are covered）。
      - name: Gate 3 — 教材importの解決チェック (順序込み)
        run: |
          echo "::group::check_scaffold_curriculum_alignment.py"
          python3 scripts/curriculum-qa/check_scaffold_curriculum_alignment.py
          echo "::endgroup::"

      # Gate 4: 2026-07-26 配線。Gate 3 と同じ穴だった。両スクリプトとも書かれてから
      # 一度も呼ばれておらず、リポジトリ全体を grep してもスクリプト自身以外に
      # 名前が出てこなかった。
      #
      # 2026-07-27 追記: 同じ顔ぶれを check_quality.sh 側にも入れた（PR#333）。
      # 以前は「1ファイル単位で走るから corpus 全体の破損を観測できない」を理由に
      # 入れていなかったが、その結果、手元が緑でも CI が赤くなる状態が常態化していた。
      # check_quality.sh 側は渡されたファイルの置き場所を corpus とみなして
      # 同じ検査を一度だけ走らせる。ここと向こうで顔ぶれがずれたら、また同じずれが戻る。
      # 引数は明示して渡す。スクリプト側の既定値に頼ると、教材の置き場所を変えたときに
      # 「0件検査して緑」になる。
      - name: Gate 4 — 用語ゆれ・day間参照チェック (corpus 全体)
        run: |
          # 2つのチェックを1つの run: に置くと、前半が落ちた時点で bash -e が
          # 打ち切って後半が一度も走らない。レビューで「片方しか見えていない」
          # 状態を毎回作るため、終了コードを個別に受けて最後にまとめて落とす。
          terms_status=0
          crossref_status=0
          selftest_status=0
          why_status=0
          variants_status=0
          steptime_status=0
          anchor_status=0
          procorder_status=0
          stepref_status=0
          scan_status=0
          tagbal_status=0
          falsesuccess_status=0
          zipref_status=0
          unusedimg_status=0
          echo "::group::test_markdown_scan.py — フェンス解釈そのものの退行テスト"
          python3 scripts/curriculum-qa/test_markdown_scan.py || scan_status=$?
          echo "::endgroup::"
          echo "::group::test_check_crossref.py — 参照検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_crossref.py || selftest_status=$?
          echo "::endgroup::"
          echo "::group::test_check_variants.py — 書き分け検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_variants.py || variants_status=$?
          echo "::endgroup::"
          echo "::group::check_variants.py — 同じ語が2通りに書かれていないか"
          python3 scripts/curriculum-qa/check_variants.py material/30days-curriculum || variants_status=$?
          echo "::endgroup::"
          echo "::group::test_check_step_time.py — 所要時間検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_step_time.py || steptime_status=$?
          echo "::endgroup::"
          echo "::group::check_step_time.py — ステップ表の合計と本文の合計時間が合うか"
          python3 scripts/curriculum-qa/check_step_time.py material/30days-curriculum || steptime_status=$?
          echo "::endgroup::"
          echo "::group::test_check_anchor.py — 書き込み先検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_anchor.py || anchor_status=$?
          echo "::endgroup::"
          echo "::group::check_anchor.py — コードブロックの書き込み先が分かるか"
          python3 scripts/curriculum-qa/check_anchor.py material/30days-curriculum || anchor_status=$?
          echo "::endgroup::"
          echo "::group::test_check_procedure_order.py — 手続きの順番検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_procedure_order.py || procorder_status=$?
          echo "::endgroup::"
          echo "::group::check_procedure_order.py — まだ書いていない手続きを呼んでいないか"
          python3 scripts/curriculum-qa/check_procedure_order.py material/30days-curriculum || procorder_status=$?
          echo "::endgroup::"
          echo "::group::test_check_step_ref.py — Step 参照検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_step_ref.py || stepref_status=$?
          echo "::endgroup::"
          echo "::group::check_step_ref.py — 本文が指す Step が実在するか"
          python3 scripts/curriculum-qa/check_step_ref.py material/30days-curriculum || stepref_status=$?
          echo "::endgroup::"
          echo "::group::test_check_tag_balance.py — 閉じタグ検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_tag_balance.py || tagbal_status=$?
          echo "::endgroup::"
          echo "::group::check_tag_balance.py — 開いた JSX タグが30日のどこかで閉じるか"
          python3 scripts/curriculum-qa/check_tag_balance.py material/30days-curriculum || tagbal_status=$?
          echo "::endgroup::"
          echo "::group::test_check_false_success.py — 偽の完了宣言検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_false_success.py || falsesuccess_status=$?
          echo "::endgroup::"
          echo "::group::check_false_success.py — 閉じていないのに完了を宣言していないか"
          python3 scripts/curriculum-qa/check_false_success.py material/30days-curriculum || falsesuccess_status=$?
          echo "::endgroup::"
          echo "::group::test_check_zip_reference.py — 照合先検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_zip_reference.py || zipref_status=$?
          echo "::endgroup::"
          echo "::group::check_zip_reference.py — 販売ZIPに無いものと見比べさせていないか"
          python3 scripts/curriculum-qa/check_zip_reference.py material/30days-curriculum || zipref_status=$?
          echo "::endgroup::"
          echo "::group::test_check_unused_image.py — 未参照画像検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_unused_image.py || unusedimg_status=$?
          echo "::endgroup::"
          echo "::group::check_unused_image.py — どこからも参照されない画像が無いか"
          python3 scripts/curriculum-qa/check_unused_image.py material/30days-curriculum || unusedimg_status=$?
          echo "::endgroup::"
          echo "::group::test_check_why.py — 説明の分量検査そのものの退行テスト"
          python3 scripts/curriculum-qa/test_check_why.py || why_status=$?
          echo "::endgroup::"
          echo "::group::check_why.py — コードの直後に理由が書かれているか"
          python3 scripts/curriculum-qa/check_why.py material/30days-curriculum || why_status=$?
          echo "::endgroup::"
          echo "::group::check_terms.py — 同じ概念が2通りの表記に割れていないか"
          python3 scripts/curriculum-qa/check_terms.py material/30days-curriculum || terms_status=$?
          echo "::endgroup::"
          echo "::group::check_crossref.py — 前の日を指す参照の先が実在するか"
          python3 scripts/curriculum-qa/check_crossref.py material/30days-curriculum || crossref_status=$?
          echo "::endgroup::"
          if [ "$terms_status" -ne 0 ] || [ "$crossref_status" -ne 0 ] || [ "$selftest_status" -ne 0 ] || [ "$why_status" -ne 0 ] || [ "$variants_status" -ne 0 ] || [ "$steptime_status" -ne 0 ] || [ "$anchor_status" -ne 0 ] || [ "$procorder_status" -ne 0 ] || [ "$stepref_status" -ne 0 ] || [ "$scan_status" -ne 0 ] || [ "$tagbal_status" -ne 0 ] || [ "$falsesuccess_status" -ne 0 ] || [ "$zipref_status" -ne 0 ] || [ "$unusedimg_status" -ne 0 ]; then
            echo "::error::Gate 4 失敗 (check_terms.py=$terms_status / check_crossref.py=$crossref_status / test_check_crossref.py=$selftest_status / check_why.py=$why_status / check_variants.py=$variants_status / check_step_time.py=$steptime_status / check_anchor.py=$anchor_status / check_procedure_order.py=$procorder_status / check_step_ref.py=$stepref_status / test_markdown_scan.py=$scan_status / check_tag_balance.py=$tagbal_status / check_false_success.py=$falsesuccess_status / check_zip_reference.py=$zipref_status / check_unused_image.py=$unusedimg_status)"
            exit 1
          fi

      # gen_procedure_map.py は「生成器」であってチェッカーではないため配線しない。
      # CI に置くと再生成して破棄するだけの「緑のno-op」になり、
      # 「走った=検査した」と誤読させる。配線するなら必ず差分検出の形にすること:
      #   python3 scripts/curriculum-qa/gen_procedure_map.py \
      #     && git diff --exit-code material/30days-curriculum/_meta/procedure-day-map.json
