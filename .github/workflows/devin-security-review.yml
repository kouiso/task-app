name: Devin Security Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src/**/*.js'
      - 'prisma/**/*'
      - 'package*.json'
      - '.env*'

jobs:
  security-review:
    # DEVIN_REVIEW_ENABLED へ移行するまでの間、旧 CODEX_REVIEW_ENABLED でも動くようにしている
    if: vars.DEVIN_REVIEW_ENABLED == 'true' || vars.CODEX_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Devin Security Review
        id: devin
        continue-on-error: true
        env:
          COGNITION_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          WINDSURF_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_OUTPUT_FILE: devin-security-review.md
          DEVIN_PROMPT: |
            この変更のセキュリティ面を確認してください。ファイルの書き換えは行わないでください。

            必ず日本語で、利用者に影響する危険を平易に説明してください。
            問題がなければ「重大なセキュリティ問題は見つかりませんでした」と書いてください。
            秘密の値、秘密鍵、パスワードは出力しないでください。

            確認すること:
            - ログインや権限の抜け道がないか
            - 入力値の扱いが安全か
            - 個人情報や秘密情報が漏れないか
            - エラー表示で余計な情報を出していないか
            - 依存パッケージ変更に危険がないか
        run: bash .github/scripts/run-devin-review.sh

      # レビューは補助なので、落ちても CI を赤にせず警告だけ残す（失敗通知で埋もれさせない）
      - name: Warn on Devin failure
        if: steps.devin.outcome == 'failure'
        run: echo "::warning::Devin CLI の実行に失敗しました。ログを確認してください"

      - name: Comment security review result
        if: steps.devin.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('devin-security-review.md', 'utf8').trim();
            if (!body) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
