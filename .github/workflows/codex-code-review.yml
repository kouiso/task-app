name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  codex-review:
    if: |
      (github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'develop') &&
      vars.CODEX_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Codex Code Review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.5
          safety-strategy: drop-sudo
          sandbox: workspace-write
          output-file: codex-review.md
          prompt: |
            この変更をレビューしてください。

            必ず日本語で、具体的で直せる指摘だけを書いてください。
            指摘がない場合は「重大な問題は見つかりませんでした」と書いてください。

            確認すること:
            - 型の安全性が保たれているか
            - 利用者に見える不具合が増えていないか
            - セキュリティ上の危険がないか
            - 既存の書き方と大きくずれていないか
            - 必要なテストが足りているか

      # 課金上限は開発側で直せる不具合ではないので、赤にしても失敗通知が鳴るだけで対処に繋がらん。
      # 上限起因かどうかを OpenAI API に問い合わせて切り分け、上限なら緑で終える。
      - name: Classify Codex failure
        if: steps.codex.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROBE_MODEL: gpt-5.5
        run: bash .github/scripts/classify-codex-failure.sh

      - name: Comment review result
        if: steps.codex.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('codex-review.md', 'utf8').trim();
            if (!body) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
