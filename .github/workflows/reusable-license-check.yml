name: License Check
on:
  workflow_call:
    inputs:
      disallow-licenses:
        required: false
        type: string
        description: 'Semicolon-separated list of disallowed licenses'
        default: 'GPL;GPL-2.0;GPL-3.0;LGPL;LGPL-3.0;AGPL-3.0;SSPL;EUPL;CDDL-1.0;EPL-1.0;OPL-1.0'

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup tools with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Check if package files have changed
        id: check_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash .github/ci/run.sh license-changes

      - name: Install dependencies
        if: steps.check_changes.outputs.changes == 'true'
        run: npm ci

      - name: Check licenses
        if: steps.check_changes.outputs.changes == 'true'
        env:
          DISALLOWED_LICENSES: ${{ inputs.disallow-licenses }}
        run: |
          npm install -g license-checker
          bash .github/ci/run.sh license
