name: Codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  codex:
    # 他2本（codex-code-review.yml / codex-security-review.yml）と同じガード。
    # これが無いと、Codex を無効にしていてもメンションだけでジョブが起動し、
    # openai/codex-action が read_server_info で必ず失敗して CI が赤くなる。
    # 赤が常態になるとレビューの信号が読めなくなるので、3本で条件を揃える。
    if: |
      vars.CODEX_REVIEW_ENABLED == 'true' &&
      !endsWith(github.actor, '[bot]') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@codex'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Codex
        id: codex
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.5
          safety-strategy: drop-sudo
          sandbox: workspace-write
          prompt: |
            このリポジトリで依頼された作業を行ってください。

            必ず守ること:
            - main、master、develop へ直接 push しない
            - 変更が必要な場合は新しいブランチで作業し、Pull Request を作る
            - コメントと説明は日本語で書く
            - 利用者が何をできるようになったかを説明する
            - 動作確認の結果を残す

      # 課金上限は開発側で直せる不具合ではないので、赤にしても失敗通知が鳴るだけで対処に繋がらん。
      # 上限起因かどうかを OpenAI API に問い合わせて切り分け、上限なら緑で終える。
      - name: Classify Codex failure
        if: steps.codex.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROBE_MODEL: gpt-5.5
        run: bash .github/scripts/classify-codex-failure.sh
