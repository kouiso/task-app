name: npm audit

on:
  push:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 9 * * 1' # 毎週月曜 9:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ${{ vars.RUNNER_LINUX }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # devDependencies チェーン（lighthouse / lint-staged / textlint 経由）は
        # upstream に修正版が無い advisory（braces など）を含み全バージョンが対象のため、
        # --omit=dev なしでは常に FAIL しゲートとして機能しない。本番依存のみを対象にする。
        run: npm audit --omit=dev --audit-level=high
