# 全36冊を組んで検査する。Issue #385。
#
# PRゲート(pdf-book-gate.yml)は、36冊全部の見た目が変わりうる変更を見つけたら
# その場で全冊組む。こっちの役目は、どのパス指定でも表せんドリフトを拾うこと。
# ツールチェーン自体は scripts/pdf-book/toolchain/package-lock.json で固定済みなので、
# 残る外部変動は runner イメージ側の poppler / Chromium / OS 更新だけ。
# リポジトリの差分に現れんので、週次で組んで初めて分かる。
name: 教材PDF全36冊検査

on:
  # push: main では起動させん。PRゲートが「36冊全部の見た目が変わりうる変更」では
  # 既に全36冊を組んどるので、マージ後に同じものを組み直しても情報が増えん。
  # 実測18分/回で、教材mdのPRがマージされる度に払うと月200分を超える。
  # private にすると GitHub Actions は月2,000分の枠に入る（public は無制限）ので、
  # ここを残したままやと公開設定を変えた時に効いてくる。
  # 直接 main へ push された場合の取りこぼしは、下の週次実行が7日以内に拾う。
  schedule:
    # 毎週月曜 03:00 JST
    - cron: '0 18 * * 0'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  full:
    name: 教材PDF全36冊検査
    # 判定が描画環境に依存するので、PRゲートと同じイメージに固定する
    runs-on: ubuntu-24.04
    # PRゲート(pdf-book-gate.yml)と同じ上限に揃える。全36冊の組版はゲートの
    # 各runで実測59〜67分かかるので、60分では1回分さえ収まらない。90分で
    # 組版本体＋余裕20分ほどが確保できる。再試行に入れるのは序盤で落ちた
    # 場合（npm ci の取得失敗など）だけで、組版途中の失敗を二度組む余裕はない
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js を用意
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: poppler を用意
        # 既定の apt は dpkg のロックを無期限に待つので、待ち上限を切らんと
        # runner 起動直後のロック競合でジョブの持ち時間を丸ごと食う
        timeout-minutes: 10
        run: |
          # runner 起動直後は unattended-upgrades が dpkg のロックを握っとることがある。
          # 既定の apt はロックを無期限に待つので、待ち上限を切らんとジョブの持ち時間を
          # 丸ごと食う（update -qq が40分、playwright の --with-deps が15分ハングした）。
          # コマンドラインの -o では playwright が内部で呼ぶ apt に効かんので設定で入れる
          echo 'DPkg::Lock::Timeout "180";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout > /dev/null
          sudo apt-get install -y -qq poppler-utils \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          pdftotext -v

      - name: Chromium をキャッシュから復元
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-ubuntu-24.04-${{ hashFiles('package-lock.json') }}

      - name: Chromium を用意
        # --with-deps が apt を叩くので、poppler と同じ理由で上限を切る
        timeout-minutes: 15
        run: |
          # --with-deps も内部で apt を叩く。ロック競合は上の設定で上限が付いとるが、
          # 掴み損ねた時のために1回だけやり直す
          npx playwright install --with-deps chromium \
            || npx playwright install --with-deps chromium
          # Ubuntu 24.04 は AppArmor で非特権 user namespace を止めとる。
          # build_pdf_book.py は非rootではサンドボックスを外さん方針なので、
          # これが有効なままやと mermaid の puppeteer が起動直後に死んで図が全滅する。
          # サンドボックスを外すのやのうて、張れるようにする
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # find_browser() は見つからんかったら黙って None を返し、mermaid が図ごとに
          # 約650MBの Chrome を取りに行く。実体を突き止めて PDF_BOOK_BROWSER に渡す
          browser="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -regextype posix-extended \
            -regex '.*/chromium-[0-9]+/chrome-linux(64)?/chrome' 2>/dev/null \
            | sort -V | tail -n 1 || true)"
          if [ -z "$browser" ]; then
            echo "::error::Chromium が $PLAYWRIGHT_BROWSERS_PATH に見つからん"
            find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi
          echo "PDF_BOOK_BROWSER=$browser" >> "$GITHUB_ENV"
          echo "Chromium: $browser"

      - name: 全36冊を組む
        env:
          # build_pdf_book.py が冊別ログを書く先。WORK_DIR(dist/.pdf-book-build)は
          # 再試行の rmtree で消えるので、job 中ずっと残る RUNNER_TEMP 配下に出す
          PDF_BOOK_BUILD_LOG_DIR: ${{ runner.temp }}/pdf-book-logs
        run: |
          # 組版ログをファイルにも残す。#501 の正体は組版時間が当時の 60 分
          # 上限に届いたタイムアウト。job ログ自体は残るが、どの冊のどの外部
          # プロセスが返らんかったかは job ログだけでは分からんので、冊別ログを
          # artifact で回収できる形にする（下の upload-artifact がこの dir を拾う）
          # ログ dir は tee がファイルを開くより先に作る。無いままだと tee が
          # ENOENT で exit 1 して pipefail 経由で組版成功も失敗扱いになる
          mkdir -p "$PDF_BOOK_BUILD_LOG_DIR"
          make book-pdf 2>&1 | tee "$PDF_BOOK_BUILD_LOG_DIR/.pdf-book-build.log" || \
            { echo "::warning::組版に失敗したので1回だけやり直す"; make book-pdf 2>&1 | tee -a "$PDF_BOOK_BUILD_LOG_DIR/.pdf-book-build.log"; }

      - name: 組版ログを残す
        # 失敗しても落ちたままの中間成果を拾う。固まった冊の特定と、
        # どの外部プロセスが返らんかったかの切り分けに使う（#501）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-book-build-logs
          # v4.6.2 の既定は隠し名のファイルを拾わん（include-hidden-files: false）。
          # tee 側のログは `.pdf-book-build.log` とドット始まりなので明示して拾う
          include-hidden-files: true
          path: ${{ runner.temp }}/pdf-book-logs/
          # 拾う対象が 0 件でも黙って緑になると、artifact を取りこぼしたことに
          # 気付かん。snapshot-gate.yml と同じく warn にして空振りを見えるようにする
          if-no-files-found: warn

      - name: 出力を検査
        run: make book-pdf-verify
