name: Public Content Check

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

# 同じ issue/PR での投稿・編集は直列化する。目印コメントの更新競合を避けるため
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-public-content:
    name: Scan body text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PRのコードを実行しない作りにするため、スクリプトは同一リポのPRならhead、
      # forkや本文イベントならデフォルトブランチのものを使う
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.repository.default_branch }}
      - name: Run public-content check
        env:
          # 本文の取り出し元はイベントで違う。|| 連鎖だと空のレビュー/コメントのとき
          # 別物の本文に落ちるので、イベント名で明示的に選ぶ
          CHECK_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event_name == 'pull_request_review_comment' && github.event.comment.body || github.event_name == 'pull_request_review' && github.event.review.body || github.event_name == 'pull_request' && github.event.pull_request.body || github.event_name == 'issues' && github.event.issue.body || '' }}
        run: >-
          node .github/ci/check-public-content.mjs
          --rules .github/public-content-rules.json
          --result "$RUNNER_TEMP/content-result.json"
      - name: Upsert marker comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const resultPath = `${process.env.RUNNER_TEMP}/content-result.json`;
            if (!fs.existsSync(resultPath)) {
              core.setFailed('public content check did not produce a result file');
              return;
            }
            const mod = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/ci/check-public-content.mjs`).href
            );
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const number = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const eventName = context.eventName;
            const login =
              context.payload.comment?.user?.login ?? context.payload.review?.user?.login ?? null;
            const targetLabel =
              (mod.TARGET_LABELS[eventName] ?? '本文') + (login ? `（@${login}）` : '');
            const targetKey = mod.targetKeyFor(eventName, context.payload);
            const marker = mod.markerFor(targetKey);
            const body = mod.buildComment(result, targetLabel, targetKey);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            try {
              if (existing) {
                if (existing.body !== body) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body,
                  });
                }
              } else if (!result.ok) {
                // 緑のときはコメントを増やさない。検出があるときだけ1つ作る
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body,
                });
              }
            } catch (error) {
              // fork からのPRはトークンが読み取り専用でコメントできない。検査の成否はそのまま残す
              core.warning(`comment upsert failed: ${error.message}`);
            }
            if (!result.ok) {
              core.setFailed('公開内容チェック: 公開できない可能性のある記述を検出（コメントを参照）');
            }
