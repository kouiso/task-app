name: AI Rules Drift Check

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.gemini/styleguide.md'
      - '.github/copilot-instructions.md'
      - 'scripts/sync-ai-rules.sh'
      - '.github/ci/**'

jobs:
  drift-check:
    name: Bridge files in sync with AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bridge files are in sync
        run: bash .github/ci/run.sh rules
