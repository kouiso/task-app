name: Devin Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  devin-review:
    # DEVIN_REVIEW_ENABLED へ移行するまでの間、旧 CODEX_REVIEW_ENABLED でも動くようにしている
    if: |
      (github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'develop') &&
      (vars.DEVIN_REVIEW_ENABLED == 'true' || vars.CODEX_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Devin Code Review
        id: devin
        continue-on-error: true
        env:
          COGNITION_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          WINDSURF_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_OUTPUT_FILE: devin-review.md
          DEVIN_PROMPT: |
            この変更をレビューしてください。ファイルの書き換えは行わないでください。

            必ず日本語で、具体的で直せる指摘だけを書いてください。
            指摘がない場合は「重大な問題は見つかりませんでした」と書いてください。

            確認すること:
            - 型の安全性が保たれているか
            - 利用者に見える不具合が増えていないか
            - セキュリティ上の危険がないか
            - 既存の書き方と大きくずれていないか
            - 必要なテストが足りているか
        run: bash .github/scripts/run-devin-review.sh

      # レビューは補助なので、落ちても CI を赤にせず警告だけ残す（失敗通知で埋もれさせない）
      - name: Warn on Devin failure
        if: steps.devin.outcome == 'failure'
        run: echo "::warning::Devin CLI の実行に失敗しました。ログを確認してください"

      - name: Comment review result
        if: steps.devin.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('devin-review.md', 'utf8').trim();
            if (!body) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
