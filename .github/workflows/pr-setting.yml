name: PR Auto Setting

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# 同一 workflow・同 ref の二重起動を潰す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-author:
    name: Assign Author
    if: (github.event.action == 'opened' || github.event.action == 'reopened') && github.event.pull_request.user.type != 'Bot'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const login = context.payload.pull_request.user.login;

            // GraphQL の addAssigneesToAssignable は既にassign済みだと
            // "Assignee has already been taken" で失敗するため、
            // 冪等な REST API (重複・無効assigneeを黙って無視する) を使う
            const assignees = context.payload.pull_request.assignees ?? [];
            if (assignees.some((a) => a.login === login)) {
              console.info(login + ' is already assigned to PR #' + context.issue.number);
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [login],
            });

            console.info('Assigned ' + login + ' to PR #' + context.issue.number);

  auto-label-branch:
    name: Label based on branch name
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Add label based on branch name
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.pull_request.head.ref;
            console.log(`Branch name: ${branchName}`);

            console.log('Adding label based on branch name...');
            if (branchName.startsWith('feature/')) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['feature']
              });
              console.log('Feature label added.');
            } else if (branchName.startsWith('bugfix/')) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['bugfix']
              });
              console.log('Bugfix label added.');
            } else if (branchName.startsWith('release/')) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['release']
              });
              console.log('Release label added.');
            } else if (branchName.startsWith('hotfix/')) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['hotfix']
              });
              console.log('Hotfix label added.');
            } else if (branchName.startsWith('support/')) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['support']
              });
              console.log('Support label added.');
            } else {
              console.log('No matching prefix found for label addition.');
            }

  auto-label-files:
    name: Label based on changed files
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # sync-labels: 旧 labeler.yml 側にだけあった指定。差分が外れたラベルを剥がす挙動を
      # 統合時にも保つために取り込む（旧 pr-setting.yml の auto-label-files には無かった）
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: '.github/labeler.yml'
          sync-labels: true
