# Devin 起動リクエストの定期リトライ（sweep 専用。ラベル即時起動は trigger 側だけが持つため並行重複しない）。
# リポ毎に同じ実装を抱えると修正が点在するため、正本は ritmo-devin の reusable 側に寄せる
name: Devin Slack Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  retry-devin:
    name: Retry pending Devin triggers
    # caller 側で付与しないと reusable 側の issues: write が既定 read-only トークンで効かない
    permissions:
      issues: write
      contents: read
    # 定期・手動が重なっても同一リポでは直列化し二重起動を防ぐ
    concurrency: devin-slack-retry
    # 可変ブランチ参照に secrets を渡すと参照先更新で漏洩し得るため不変 SHA で固定。
    # 中央実装 PR#14 の HEAD(942e000)。main マージ後に @main へ切替える
    uses: kouiso/ritmo-devin/.github/workflows/devin-slack-retry-reusable.yml@942e000f61f9a85f4cd1a56917a8179bcbe137f8
    secrets:
      RITMO_DEVIN_AUTOMATION_PRIVATE_KEY: ${{ secrets.RITMO_DEVIN_AUTOMATION_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
