name: CI Failure Slack Notify

on:
  workflow_run:
    workflows:
      - ".github/workflows/claudecode-implementation.yml"
      - "AI Rules Drift Check"
      - "CI"
      - "Claudecode Review"
      - "Common Setup"
      - "Devin Code Review"
      - "Devin Review"
      - "Devin Security Review"
      - "Fix Issue Headings"
      - "License Check"
      - "Material Quality Gate"
      - "Merge Quality Gate"
      - "Naming Convention Check"
      - "PR Auto Setting"
      - "PR Labeler"
      - "Performance"
      - "Pr Auto Setting"
      - "Protect main branch"
      - "Semgrep Code Scan"
      - "TruffleHog \u30b7\u30fc\u30af\u30ec\u30c3\u30c8\u30b9\u30ad\u30e3\u30f3"
      - "Unused Packages Check"
      - "ZIP Export & Environment Setup CI"
      - "destroy-container-image-and-cloudrun"
      - "development-container-image-deploy"
      - "npm audit"
      - "\u4f9d\u5b58\u95a2\u4fc2\u30ec\u30d3\u30e5\u30fc"
    types: [completed]
    branches: [main, develop]

jobs:
  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != github.workflow
    steps:
      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${COMMIT_SHA}"

          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "🚨 ${WORKFLOW_NAME} が ${HEAD_BRANCH} ブランチで失敗しました" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$HEAD_BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg short_sha "$SHORT_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              channel: $channel,
              text: $text,
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: ("🚨 CI/CD 失敗通知（" + $branch + " ブランチ）"),
                    emoji: true
                  }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*ワークフロー:*\n" + $workflow) },
                    { type: "mrkdwn", text: ("*ブランチ:*\n`" + $branch + "`") },
                    { type: "mrkdwn", text: ("*実行者:*\n" + $actor) },
                    { type: "mrkdwn", text: ("*コミット:*\n<" + $commit_url + "|" + $short_sha + ">") }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "📋 ログを確認", emoji: true },
                      url: $run_url,
                      style: "danger"
                    }
                  ]
                }
              ]
            }')

          RESPONSE=$(curl -sf -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || true

          if [ -z "$RESPONSE" ]; then
            echo "::error::Slack API request failed (network error or empty response)"
            exit 1
          fi

          if ! echo "$RESPONSE" | jq -e '.ok == true' > /dev/null; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error // "unknown_error"')
            echo "::error::Slack API error: ${ERROR}"
            exit 1
          fi
