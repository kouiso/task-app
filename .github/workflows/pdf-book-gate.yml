# 教材PDF（商品）の組版と検査をPRで強制する。Issue #385。
#
# scripts/pdf-book/ の検査は #379 で作ったが CI から一度も呼ばれておらず、
# 誰かが手で make book-pdf-verify を打った時だけ動く状態やった。#384 の紙面崩れは
# その隙間から出荷された。
#
# 【pull_request に paths: を付けてへん理由】
# path filter に当たったPRはワークフローごとスキップされ、チェックを1件も報告せん。
# このジョブを必須チェックにすると、そういうPRが Expected — waiting for status のまま
# 永久にマージ不能になる。だから起動は常にさせて、何を組むかはジョブの中で差分から決める。
#
# 【組版と検査が走らない変更パターン】(完了条件5)
#  - material/dev-guide.md / material/onboarding.md / material/pr-reviewer-rule.md
#    material/**/*.md やが本ではない。build_pdf_book.py:48 の SRC_DIR は
#    material/30days-curriculum のみを見る
#  - material/style/tutorial.css — prepare_work_dir() が複写するのは book.css だけ
#  - npx で都度取る @vivliostyle/cli / @mermaid-js/mermaid-cli の推移的依存のドリフト
#  - runner イメージ側の poppler / Chromium 更新
#    最後の2つはどのパス指定でも表せんので、pdf-book-full.yml の週次実行が受け持つ
#    （全36冊を組むのはこのゲートと週次実行の2箇所だけ。マージ後には走らせてへん）
#
# 【この検査が見ていないもの】
# #383 で見つかった4件（`=>` の合字が1グリフの `⇒` になる／行末に1〜3文字だけ残る
# 折返し／画面写真が小さくUI文字が読めん／poppler の name token 警告）は、
# 全36冊を組んでも検知できん。#384 のコミット本文が「make book-pdf は成功し
# book-pdf-verify も通っていた」と書いとる通りで、検査は空白ページ・書体埋め込み・
# コード欠け・mermaid漏れしか見ていない。総ページ数と冊をまたぐ一貫性も対象外
# （check_pdf_book.py の main() は check_one() の結果を足すだけで集約検査が無い）。
# ここが緑でも「機械検査の4項目が退行してへん」までで、「紙面が商品水準」ではない。
#
# 【マージブロックの前提】(局長判断 2026-08-18: A + C)
# このワークフローは赤緑を出すだけで、赤いPRのマージを止めるのは別の仕組みや。
#  - public の間: main の Ruleset に必須チェックとして
#    「教材PDF検査の退行テスト」「教材PDF検査」を登録して止める
#  - private にした後: Free では Ruleset もブランチ保護も使えんくなるので
#    マージブロックは消える。残るのは CI が赤くなることと ci-failure-notify.yml の
#    Slack 通知だけ。気づかんまま「守られとる」と思い込むのが一番あかんので明記しとく
#  - ci-failure-notify.yml は workflow_run に branches: [main, develop] が付いとるので、
#    pull_request でしか起動せんこのワークフローの失敗は Slack に飛ばん（head_branch が
#    PRのブランチになるため）。PRの赤は画面で見える前提。マージ後に効く
#    「教材PDF全36冊検査」だけを通知一覧に載せとる
#  - auto-merge.yml の MERGE_REQUIRE_CHECKS は automerge-action v0.16.4 に存在せん設定で、
#    あの action は「ブランチ保護で required 指定されたチェック」しか待たん。
#    つまり automerge 経路も保護頼みで、保護が無ければ止まらん
name: 教材PDF検査

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  # find_browser() が既定で見る PLAYWRIGHT_BROWSERS_PATH をここへ寄せる。
  # 揃えておかんと Chromium が見つからず、mermaid 1図ごとに約650MBの Chrome を取りに行く。
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  pdf-check-selftest:
    # 判定境界の退行テスト。件数はジョブ名に入れん — 45件目を足した瞬間に必須チェック名が
    # 変わって、Ruleset が要求する名前を誰も報告せんくなりPRが全部止まる。
    name: 教材PDF検査の退行テスト
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 判定境界の退行テスト（44ケース）
        run: |
          make book-pdf-test | tee "$RUNNER_TEMP/selftest.log"
          # 件数はスクリプト側で動的に算出しとる。減った時に緑で通さんよう突き合わせる
          grep -q '✅ 44 ケースすべて通過' "$RUNNER_TEMP/selftest.log"

  pdf-book-inspection:
    name: 教材PDF検査
    # 判定が描画環境に依存する（check_pdf_book.py の ALLOWED_FONTS は閉じた許可リストで、
    # pdffonts の列レイアウトも poppler の版で変わる）。イメージが転がると無関係に赤くなるので固定する。
    runs-on: ubuntu-24.04
    # 全36冊を組む経路が入るので長め。provisioning のハングがビルドの持ち時間を
    # 食わんよう、各ステップ側にも上限を置いとる
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR の checkout はマージコミットなので、親2つ分あれば base 先端に届く
          fetch-depth: 2

      - name: 組む対象を差分から決める
        id: select
        run: |
          books="$RUNNER_TEMP/books.txt"
          : > "$books"
          blast=0

          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [ "$parents" -ne 3 ]; then
            # コンフリクトでマージコミットが作れんかった場合。差分を狭く誤るより全冊組む
            echo "::warning::マージコミットが無いため差分を特定できん。全36冊を組む"
            echo "scope=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git rev-parse HEAD^1)"

          # -z は「NUL区切りにする」だけやのうて、パスのクォートを止める役目も持つ。
          # これを外して --name-only だけにすると、core.quotePath の既定 true が
          # 非ASCIIのパスを8進エスケープ＋二重引用符で返す。36冊すべてファイル名が
          # 日本語なので、本の検出が丸ごと空振りして「対象0冊」で緑になる。
          # quotePath=false は -z を将来外された時の保険。外れた事故はこの下の
          # トリップワイヤが検知する。
          git -c core.quotePath=false diff -z --name-only --diff-filter=d "$base" HEAD \
            > "$RUNNER_TEMP/changed.z"

          while IFS= read -r -d '' file; do
            case "$file" in
              # 36冊すべての見た目が変わりうる変更。markdown_scan.py は build_pdf_book.py と
              # check_pdf_book.py の両方が import しとるので、フェンス解釈が変われば全冊変わる
              material/style/book.css|scripts/pdf-book/*|scripts/curriculum-qa/markdown_scan.py|Makefile|.github/workflows/pdf-book-gate.yml)
                blast=1
                ;;
              material/30days-curriculum/screenshots/*)
                # 画面写真は、それを貼っとる冊だけ組み直せば足りる
                grep -rl --fixed-strings "${file##*/}" material/30days-curriculum \
                  --include='*.md' >> "$books" || true
                ;;
              material/30days-curriculum/*/*)
                : # _meta/ の json 等。紙面には出ん
                ;;
              material/30days-curriculum/*.md)
                if [ -f "$file" ]; then
                  printf '%s\n' "$file" >> "$books"
                else
                  echo "::notice::改名または移動のため組めん: $file"
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/changed.z"

          # フォントは node_modules から直接読んどるので、版が動くと全冊の字形が変わる。
          # ここを `git diff | grep -q` にすると、lock の diff がパイプバッファ(64KB)を
          # 超えた時に producer が SIGPIPE で死に、pipefail が rc=141 を返して if が偽になる。
          # 差分を必ずファイルへ落としてから引く。
          git -c core.quotePath=false diff "$base" HEAD -- package.json package-lock.json \
            > "$RUNNER_TEMP/dep.diff"
          if grep -qE '@expo-google-fonts/|@fontsource/' "$RUNNER_TEMP/dep.diff"; then
            blast=1
          fi

          if [ "$blast" -eq 1 ]; then
            scope=all
          elif [ -s "$books" ]; then
            scope=subset
          else
            scope=none
          fi

          # 教材の差分があるのに0冊になったら、パス解析が壊れとる。緑で通さん
          if [ "$scope" = "none" ] \
            && grep -qzE '^material/30days-curriculum/[^/]+\.md$' "$RUNNER_TEMP/changed.z"; then
            echo "::error::教材mdの差分があるのに対象0冊になった。パス解析が壊れとる"
            exit 1
          fi

          # 撮影の収束待ちを実ブラウザで確かめる検査は、この job の Chromium に相乗りしとる。
          # PDF の対象が0冊でも、撮影まわりを触った PR ではブラウザを用意して走らせる。
          # ここを scope だけに任せると、`scripts/curriculum-qa/` だけを触った PR で
          # 検査が自分から退けて（SKIP）、実ブラウザの主張が一度も走らんまま通る。
          browser_qa=0
          if grep -qzE '^(scripts/curriculum-qa/(shoot-page\.mjs|settle-drawn-frames-check\.mjs|shoot_screenshots\.py|test_shoot_screenshots\.py)|\.github/workflows/pdf-book-gate\.yml|package\.json|package-lock\.json|\.node-version)$' "$RUNNER_TEMP/changed.z"; then
            browser_qa=1
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "browser_qa=$browser_qa" >> "$GITHUB_OUTPUT"
          case "$scope" in
            all)    echo "全36冊を組む（36冊全部の見た目が変わりうる変更）" ;;
            subset) echo "変更のあった冊だけ組む:"; sort -u "$books" | sed 's/^/  - /' ;;
            none)   echo "PDFの出力に影響する変更が無いため、組版と検査は行わん" ;;
          esac

      - name: Node.js を用意
        if: steps.select.outputs.scope != 'none' || steps.select.outputs.browser_qa == '1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 依存をインストール
        if: steps.select.outputs.scope != 'none' || steps.select.outputs.browser_qa == '1'
        run: npm ci

      - name: poppler を用意
        if: steps.select.outputs.scope != 'none'
        # pdftotext / pdfinfo / pdffonts が無いと check_pdf_book.py は exit 2 で止まる
        timeout-minutes: 10
        run: |
          # runner 起動直後は unattended-upgrades が dpkg のロックを握っとることがある。
          # 既定の apt はロックを無期限に待つので、待ち上限を切らんとジョブの持ち時間を
          # 丸ごと食う（update -qq が40分、playwright の --with-deps が15分ハングした）。
          # コマンドラインの -o では playwright が内部で呼ぶ apt に効かんので設定で入れる
          echo 'DPkg::Lock::Timeout "180";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout > /dev/null
          sudo apt-get install -y -qq poppler-utils \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          pdftotext -v

      - name: Chromium をキャッシュから復元
        if: steps.select.outputs.scope != 'none' || steps.select.outputs.browser_qa == '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-ubuntu-24.04-${{ hashFiles('package-lock.json') }}

      - name: Chromium を用意
        if: steps.select.outputs.scope != 'none' || steps.select.outputs.browser_qa == '1'
        # --with-deps が apt を叩くので、poppler と同じ理由で上限を切る
        timeout-minutes: 15
        run: |
          # --with-deps も内部で apt を叩く。ロック競合は上の設定で上限が付いとるが、
          # 掴み損ねた時のために1回だけやり直す
          npx playwright install --with-deps chromium \
            || npx playwright install --with-deps chromium
          # Ubuntu 24.04 は AppArmor で非特権 user namespace を止めとる。
          # build_pdf_book.py は非rootではサンドボックスを外さん方針なので、
          # これが有効なままやと mermaid の puppeteer が起動直後に死んで図が全滅する。
          # サンドボックスを外すのやのうて、張れるようにする
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # find_browser() は「見つからなければ黙って None」で、そのまま組むと
          # mermaid-cli の puppeteer が図ごとに約650MBの Chrome を取りに行く。
          # ここで実体を突き止めて PDF_BOOK_BROWSER に渡す。見つからんかったら
          # 静かな劣化やのうて失敗として出す
          browser="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -regextype posix-extended \
            -regex '.*/chromium-[0-9]+/chrome-linux(64)?/chrome' 2>/dev/null \
            | sort -V | tail -n 1 || true)"
          if [ -z "$browser" ]; then
            echo "::error::Chromium が $PLAYWRIGHT_BROWSERS_PATH に見つからん"
            find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi
          echo "PDF_BOOK_BROWSER=$browser" >> "$GITHUB_ENV"
          echo "Chromium: $browser"

      # 撮影の収束待ちを実物のブラウザで確かめる検査は、Chromium が無いと自分から
      # 退ける（SKIP・exit 0）。material-gate 側は Chromium を入れてへんので、そこだけに
      # 置いとくと**実ブラウザの主張が一度も走らんまま**マージできてしまう。
      # ブラウザを用意しとるこの job で、退けたこと自体を失敗にして走らせる。
      - name: 撮影の収束待ちを実ブラウザで検査
        if: steps.select.outputs.scope != 'none' || steps.select.outputs.browser_qa == '1'
        env:
          CURRICULUM_QA_REQUIRE_BROWSER: '1'
        run: python3 scripts/curriculum-qa/test_shoot_screenshots.py

      - name: PDFを組む
        if: steps.select.outputs.scope != 'none'
        env:
          SCOPE: ${{ steps.select.outputs.scope }}
        run: |
          targets=()
          if [ "$SCOPE" != "all" ]; then
            # build_pdf_book.py:473 は引数0本やと全36冊にフォールバックする。
            # `mapfile < <(sort ...)` はプロセス置換の失敗を握り潰して 0 を返すので、
            # sort を先に走らせて状態を -e に見せ、空になった時は落とす
            sort -u "$RUNNER_TEMP/books.txt" > "$RUNNER_TEMP/books.sorted"
            mapfile -t targets < "$RUNNER_TEMP/books.sorted"
            if [ "${#targets[@]}" -eq 0 ]; then
              echo "::error::組む対象が空や。選定の結果と食い違っとる"
              exit 1
            fi
          fi
          # 関数を `||` の左に置くと -e が本体全体で無効になる。分岐ごとに1コマンドだけ
          # 置いて、関数の戻り値がそのコマンドの結果になるようにしとく
          build() {
            if [ "$SCOPE" = "all" ]; then
              make book-pdf
            else
              # Makefile の book-pdf-one は FILE 1本ずつなので、冊数分だけ
              # インタプリタ起動と作業ディレクトリの作り直しが走る。まとめて1回で呼ぶ
              python3 scripts/pdf-book/build_pdf_book.py "${targets[@]}"
            fi
          }
          # mermaid と vivliostyle は npx 経由で毎回レジストリを引き、リトライを持たん。
          # 回線の揺れで必須チェックが赤くなるのを防ぐ
          build || { echo "::warning::組版に失敗したので1回だけやり直す"; build; }

      - name: 出力を検査
        if: steps.select.outputs.scope != 'none'
        # dist は gitignore なので、dist/pdf にはこの実行で組んだ分しか入らん。
        # check_pdf_book.py は1冊単位の検査だけで冊をまたがんため、部分的でも成立する
        run: make book-pdf-verify
