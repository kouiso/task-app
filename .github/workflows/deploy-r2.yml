name: Deploy ZIP to course-library storage

# 販売 ZIP（task-app-curriculum-v*.zip）と教材本文 ZIP（task-app-textbook.zip）を
# course-library の R2 バケット（course-library-materials）に置く。サイト
# （course-library Worker）が `releases/task-app/<version>/` 配下のオブジェクトを配布元にする。
#
# ZIP の中身の定義は scripts/build-zip.sh が正（写経用の土台だけ。task-app/
# トップフォルダ付きで、完成アプリの src/・prisma/ は入らない）。
# Makefile の zip-export（dist/task-app.zip）はリポジトリほぼ全部の開発用
# アーカイブで、教材 Day 1 の `cd task-app` が成立しない＆解答が入るので
# 購入者には出さない。scripts/curriculum-qa/check-sale-package.sh が
# 販売 ZIP の必須エントリを検査する（material-gate.yml でも同じ検査が走る）。
#
# 配置ルール（course-library docs/OPERATIONS.md と同じ考え方）:
# - リリース用は「バージョンごとの不変 prefix」。一度置いたオブジェクトは上書きしない。
# - main への push（リリースの取り込み）では、前のタグからのコミット内容で版を上げ
#   （件名の「!:」か本文の脚注「BREAKING CHANGE: 」があれば major・feat なら minor・それ以外は patch）、
#   タグ v<X.Y.Z> と GitHub Release を作ってから `releases/task-app/<X.Y.Z>/` に置く。
#   タグが1本も無い初回だけは package.json の版をそのままリリース版にする。
# - workflow_dispatch の `version` 入力で任意の版名の prefix にも置ける（再アップロード用）。
# - サイトが購入者に出す版は manifest 側で版を指し替える別作業（レビュー付き）。
#
# ==== secrets の設定手順（未設定だと Check R2 secrets で失敗する）====
#
# 1. Cloudflare ダッシュボード → R2 → 「API トークンの管理」で R2 用 API トークンを作る
#    （権限は「オブジェクトの読み取りと書き込み」、対象バケットは course-library-materials
#    だけに絞るのが望ましい）
# 2. GitHub の Settings > Secrets and variables > Actions でリポジトリ secret を3つ作る
#    - R2_ACCOUNT_ID:  Cloudflare アカウント ID（ダッシュボード右側に表示される 32 桁の値）
#    - R2_ACCESS_KEY_ID:     1. で発行した Access Key ID
#    - R2_SECRET_ACCESS_KEY: 1. で発行した Secret Access Key
# 3. トークンは失効しないので一度入れればよい。漏れたときは Cloudflare 側でロールする。
#
# 注意:
# - バケットの公開設定（r2.dev・カスタム公開ドメイン）は有効にしない。配布は Worker 経由だけ。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "リリース版（例: 1.0.1）。releases/task-app/<version>/ に配置する"
        required: true
        type: string

permissions:
  contents: write

# なぜ: 2つの実行が同時に同名キーを書くと R2 側でどちらが新しいか分からなくなる。
# アップロードは直列にし、実行中のものは止めない。
concurrency:
  group: deploy-r2
  cancel-in-progress: false

env:
  RCLONE_RELEASE: "1.75.2"
  # build-zip.sh の出力名は版を含む（task-app-curriculum-v1.1.zip）ので、
  # 配布用の固定名に写してから上げる。R2 のオブジェクト名は course-library
  # manifest の material.filename と一致させる（購入者への保存名は Worker 側で
  # task-app-curriculum-v<X.Y.Z>.zip に組み直される）。
  ZIP_PATH: task-app-curriculum.zip
  ZIP_NAME: task-app-curriculum.zip
  TEXTBOOK_ZIP_PATH: task-app-textbook.zip
  TEXTBOOK_ZIP_NAME: task-app-textbook.zip
  BUCKET: course-library-materials
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  # main への push だけで動く。前のタグからのコミットを見て semver を上げ、
  # タグと GitHub Release を作る。deploy より先に版が決まるので、R2 のキーはここの出力を使う。
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      previous_version: ${{ steps.calc.outputs.previous_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: calc
        # 判定の決まりとテストは .github/ci/next-version.sh と next-version.test.mjs にある
        run: bash .github/ci/next-version.sh

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.calc.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release ${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    # version は main push 以外ではスキップされる。スキップは失敗ではないので
    # 手動実行はそのまま進め、main push では版づくりの成功が要る。
    needs: [version]
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 配置先キーを決める。
      # - workflow_dispatch: 入力 version をそのまま版として使う（形式チェック付き）
      # - push main: version ジョブが作った版
      - name: Resolve object key
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.version.outputs.previous_version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[a-z0-9][a-z0-9.-]{0,62}$'; then
              echo "::error::version の形式が不正です: ${INPUT_VERSION}（course-library の manifest 形式に合わせてください）"
              exit 1
            fi
            PREFIX="releases/task-app/${INPUT_VERSION}/"
            echo "release_version=${INPUT_VERSION}" >> "$GITHUB_ENV"
          else
            PREFIX="releases/task-app/${RELEASE_VERSION}/"
            echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          fi
          echo "object_key=${PREFIX}${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "textbook_object_key=${PREFIX}${TEXTBOOK_ZIP_NAME}" >> "$GITHUB_ENV"
          if [ -n "${PREVIOUS_VERSION}" ]; then
            echo "previous_textbook_object_key=releases/task-app/${PREVIOUS_VERSION}/${TEXTBOOK_ZIP_NAME}" >> "$GITHUB_ENV"
          fi
          echo "配置先: r2://${BUCKET}/${PREFIX}${ZIP_NAME} と r2://${BUCKET}/${PREFIX}${TEXTBOOK_ZIP_NAME}"

      # sale-package フェーズと同じ入口（material-gate.yml と同じ定義）:
      # build-zip.sh が写経用の土台 ZIP を組み、check-sale-package.sh が
      # 必須エントリ（task-app/ トップ・scaffold-from-scratch.sh など）を検査する。
      - name: Build sales ZIP
        run: |
          bash scripts/build-zip.sh
          bash scripts/curriculum-qa/check-sale-package.sh
          shopt -s nullglob
          built=(task-app-curriculum-*.zip)
          if [ "${#built[@]}" -eq 0 ]; then
            echo "::error::task-app-curriculum-*.zip が見つかりません"
            exit 1
          fi
          cp "${built[0]}" "${ZIP_PATH}"
          echo "built from ${built[0]} -> ${ZIP_PATH}"

      # secrets 未設定でも「その時点の ZIP の中身」を run の画面から確認できるようにする。
      - name: Upload sales ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-app-zip
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      # PDF の入力が前の版から変わっていなければ、70分級の組版をせず
      # 前の版の ZIP を R2 内で写す。判定の根拠は .github/ci/pdf-release-inputs.mjs。
      - name: Decide textbook input freshness
        id: textbook-inputs
        env:
          PREVIOUS_VERSION: ${{ needs.version.outputs.previous_version }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${PREVIOUS_VERSION}" ]; then
            {
              echo "pdf_inputs_changed=true"
              echo "pdf_inputs_reason=no previous release input is available; rebuilding PDFs"
            } >> "$GITHUB_OUTPUT"
          else
            node .github/ci/pdf-release-inputs.mjs --base "v${PREVIOUS_VERSION}" --head HEAD
          fi

      # secrets は step の if: に書けないので、env に載せて空かどうかをシェルで見る。
      # 未設定のまま進むと rclone が分かりにくい認証エラーで落ちるので、先にここで明示的に止める。
      - name: Check R2 secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [ -z "${R2_ACCOUNT_ID}" ] && missing+=("R2_ACCOUNT_ID")
          [ -z "${R2_ACCESS_KEY_ID}" ] && missing+=("R2_ACCESS_KEY_ID")
          [ -z "${R2_SECRET_ACCESS_KEY}" ] && missing+=("R2_SECRET_ACCESS_KEY")
          if ((${#missing[@]})); then
            echo "::error::Cloudflare R2 用の secrets が未設定です: ${missing[*]}"
            echo "::error::設定手順は .github/workflows/deploy-r2.yml 冒頭のコメントを参照してください"
            exit 1
          fi

      - name: Install rclone
        run: |
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_RELEASE}/rclone-v${RCLONE_RELEASE}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_RELEASE}/SHA256SUMS"
          grep "rclone-v${RCLONE_RELEASE}-linux-amd64.zip" SHA256SUMS | sha256sum -c -
          unzip -q "rclone-v${RCLONE_RELEASE}-linux-amd64.zip"
          echo "${PWD}/rclone-v${RCLONE_RELEASE}-linux-amd64" >> "${GITHUB_PATH}"
          "${PWD}/rclone-v${RCLONE_RELEASE}-linux-amd64/rclone" version

      - name: Resolve textbook source
        id: textbook-mode
        env:
          PDF_INPUTS_CHANGED: ${{ steps.textbook-inputs.outputs.pdf_inputs_changed }}
          PDF_INPUTS_REASON: ${{ steps.textbook-inputs.outputs.pdf_inputs_reason }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if rclone lsf "r2:${BUCKET}/${object_key}" | grep -q .; then
            echo "::error::${object_key} は既に存在します。不変 prefix の約束により上書きしません（version を上げてください）"
            exit 1
          fi
          if rclone lsf "r2:${BUCKET}/${textbook_object_key}" | grep -q .; then
            echo "::error::${textbook_object_key} は既に存在します。不変 prefix の約束により上書きしません（version を上げてください）"
            exit 1
          fi
          mode=build
          if [ "${PDF_INPUTS_CHANGED}" = "false" ]; then
            if [ -n "${previous_textbook_object_key:-}" ] && rclone lsl "r2:${BUCKET}/${previous_textbook_object_key}" >/dev/null 2>&1; then
              mode=copy
              echo "PDF inputs are unchanged; copying ${previous_textbook_object_key} inside R2"
            else
              echo "::warning::前の版の教材 ZIP が R2 に無いため、今回は組み直す"
            fi
          else
            echo "${PDF_INPUTS_REASON}"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      # 組版は pdf-book-full.yml と同じ ubuntu-24.04・同じ composite action・同じ入口を使う。
      - name: 組版環境を用意
        if: steps.textbook-mode.outputs.mode == 'build'
        uses: ./.github/actions/pdf-book-env

      - name: Build textbook PDFs
        if: steps.textbook-mode.outputs.mode == 'build'
        env:
          PDF_BOOK_BUILD_LOG_DIR: ${{ runner.temp }}/pdf-book-logs
        run: bash .github/ci/run.sh pdf-full-build

      - name: Upload textbook build logs
        if: always() && steps.textbook-mode.outputs.mode == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-book-build-logs
          include-hidden-files: true
          path: ${{ runner.temp }}/pdf-book-logs/
          if-no-files-found: warn

      - name: Verify textbook PDFs
        if: steps.textbook-mode.outputs.mode == 'build'
        run: bash .github/ci/run.sh pdf-full-verify

      - name: Package textbook ZIP
        if: steps.textbook-mode.outputs.mode == 'build'
        run: bash .github/ci/package-textbook-zip.sh dist/pdf "${TEXTBOOK_ZIP_PATH}"

      # R2 は S3 互換 API。access_key_id / secret_access_key / endpoint を環境変数で渡す。
      # copyto で指定キーへ新規オブジェクトとして置く（prefix は version ごとに新しい）。
      - name: Upload sales ZIP to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if rclone lsf "r2:${BUCKET}/${object_key}" | grep -q .; then
            echo "::error::${object_key} は既に存在します。不変 prefix の約束により上書きしません（version を上げてください）"
            exit 1
          fi
          if rclone lsf "r2:${BUCKET}/${textbook_object_key}" | grep -q .; then
            echo "::error::${textbook_object_key} は既に存在します。不変 prefix の約束により上書きしません（version を上げてください）"
            exit 1
          fi
          rclone copyto -v --stats-one-line "${ZIP_PATH}" "r2:${BUCKET}/${object_key}"
          rclone lsl "r2:${BUCKET}/${object_key}"

      - name: Upload textbook ZIP to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TEXTBOOK_MODE: ${{ steps.textbook-mode.outputs.mode }}
        run: |
          if rclone lsf "r2:${BUCKET}/${textbook_object_key}" | grep -q .; then
            echo "::error::${textbook_object_key} は既に存在します。不変 prefix の約束により上書きしません（version を上げてください）"
            exit 1
          fi
          if [ "${TEXTBOOK_MODE}" = "copy" ]; then
            rclone copyto "r2:${BUCKET}/${previous_textbook_object_key}" "r2:${BUCKET}/${textbook_object_key}"
          else
            rclone copyto -v --stats-one-line "${TEXTBOOK_ZIP_PATH}" "r2:${BUCKET}/${textbook_object_key}"
          fi
          rclone lsl "r2:${BUCKET}/${textbook_object_key}"
          if [ "${TEXTBOOK_MODE}" = "copy" ]; then
            rclone copyto "r2:${BUCKET}/${textbook_object_key}" "${TEXTBOOK_ZIP_PATH}"
          fi
          bash .github/ci/check-textbook-zip.sh "${TEXTBOOK_ZIP_PATH}"

      - name: Upload textbook ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-app-textbook-zip
          path: ${{ env.TEXTBOOK_ZIP_PATH }}
          retention-days: 7

      # ==== course-library への昇格通知 ====
      # 配置した版を購入者に見せる判断は course-library 側の
      # promote-product.yml が握る（manifest 更新 PR → レビュー → マージ → deploy）。
      # ここでは repository_dispatch(product-release) で版を通知するだけ。
      # 通知の資格情報（どちらも無い時は手動コマンドを summary に出して終わる。
      # リリース自体は失敗にしない）:
      # - APP_ID / APP_PRIVATE_KEY: kouiso/course-library にインストール済みの
      #   GitHub App（contents: write。App が course-library に未インストールでも
      #   トークン発行で失敗 → 手動フォールバックへ落ちる）
      # - COURSE_LIBRARY_TOKEN: 上記が無い時の fine-grained PAT（contents:write）
      - name: Create course-library dispatch token
        id: dispatch-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kouiso
          repositories: course-library
          permission-contents: write

      - name: Notify course-library of the new release
        env:
          APP_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.COURSE_LIBRARY_TOKEN }}
          PAYLOAD_VERSION: ${{ env.release_version }}
        run: |
          TOKEN="${APP_TOKEN:-$PAT_TOKEN}"
          SHA256="$(sha256sum "${ZIP_PATH}" | cut -d' ' -f1)"
          TEXTBOOK_SHA256="$(sha256sum "${TEXTBOOK_ZIP_PATH}" | cut -d' ' -f1)"
          SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DATE="$(date +%F)"
          if [ -z "${TOKEN}" ]; then
            {
              echo "### course-library への昇格通知: 手動フォールバック"
              echo "通知用の資格情報（APP_ID/APP_PRIVATE_KEY または COURSE_LIBRARY_TOKEN）が無いため、"
              echo "manifest の版指し替えは手動で起こしてください:"
              echo ""
              echo '```bash'
              echo "gh workflow run promote-product.yml -R kouiso/course-library \\"
              echo "  -f collection=task-app -f version=${PAYLOAD_VERSION} -f date=${DATE}"
              echo '```'
              echo ""
              echo "- ZIP sha256: \`${SHA256}\`"
              echo "- 配置キー: \`${object_key}\`"
              echo "- 教材 ZIP sha256: \`${TEXTBOOK_SHA256}\`"
              echo "- 教材配置キー: \`${textbook_object_key}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload=$(printf '{"event_type":"product-release","client_payload":{"collection":"task-app","version":"%s","date":"%s","sha256":"%s","source":"%s"}}' \
            "${PAYLOAD_VERSION}" "${DATE}" "${SHA256}" "${SOURCE}")
          if ! curl -fsS --connect-timeout 10 --max-time 30 -X POST "https://api.github.com/repos/kouiso/course-library/dispatches" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "${payload}"; then
            echo "::warning::course-library への dispatch が失敗しました。手動で promote-product.yml を起こしてください（version=${PAYLOAD_VERSION}）"
          fi
