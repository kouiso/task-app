name: Devin Slack Trigger

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  trigger-devin:
    name: Trigger Devin via Slack
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: |
      github.event.label.name == 'devin' ||
      github.event.label.name == 'devin-queued'
    concurrency:
      group: devin-trigger-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dispatch to Slack or acknowledge queue
        id: dispatch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          DEVIN_USER_ID: ${{ vars.SLACK_DEVIN_USER_ID }}
          # 任意: Slack bang コマンド（例: "ultra" / "swe"）。空なら Devin 側デフォルト。
          DEVIN_MODE: ${{ vars.DEVIN_MODE }}
          TRIGGER_LABEL: devin
        with:
          script: |
            const relay = require('./.github/scripts/devin-slack-relay.js');
            await relay.dispatch({ github, context, core });

      # Devin 側の即時エラーはスレッド返信として返る。起動遅延を吸収するため待つ。
      - name: Wait for Devin startup reply
        if: steps.dispatch.outputs.thread_ts != ''
        run: sleep 75

      - name: Check Devin reply and update issue
        if: steps.dispatch.outputs.thread_ts != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          DEVIN_USER_ID: ${{ vars.SLACK_DEVIN_USER_ID }}
          DEVIN_MODE: ${{ vars.DEVIN_MODE }}
          TRIGGER_LABEL: devin
        with:
          script: |
            const relay = require('./.github/scripts/devin-slack-relay.js');
            await relay.verify({ github, context, core });
