name: Semgrep Code Scan
'on':
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read

jobs:
  semgrep:
    name: Semgrep コード品質スキャン
    runs-on: ${{ vars.RUNNER_LINUX }}
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    # 移行期間中は Dependabot PR (#356 / #357) が open のまま残るため、両 bot を除外して既存 PR の挙動を変えない
    if: (github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config auto --error
