name: ZIP Export & Environment Setup CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  zip-export:
    name: ZIP Export Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ZIP
        run: bash .github/ci/run.sh zip-build

      - name: Verify ZIP exists
        run: bash .github/ci/run.sh zip-exists
      - name: Verify ZIP contents
        run: bash .github/ci/run.sh zip-contents
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-app-zip
          path: dist/task-app.zip
          retention-days: 1

  environment-setup:
    name: Environment Setup Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: zip-export
    steps:
      - name: Checkout CI entry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ZIP artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task-app-zip
          path: ./

      - name: Extract ZIP
        run: bash "$GITHUB_WORKSPACE/.github/ci/run.sh" zip-extract
      - name: Setup tools with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Setup Node.js (from package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './extracted/package.json'
          package-manager-cache: false

      - name: Setup environment file
        working-directory: ./extracted
        run: bash "$GITHUB_WORKSPACE/.github/ci/run.sh" zip-env
      - name: Install dependencies
        working-directory: ./extracted
        run: bash "$GITHUB_WORKSPACE/.github/ci/run.sh" zip-install
      - name: Generate Prisma Client
        working-directory: ./extracted
        run: bash "$GITHUB_WORKSPACE/.github/ci/run.sh" zip-prisma
      - name: Type check
        working-directory: ./extracted
        run: bash "$GITHUB_WORKSPACE/.github/ci/run.sh" zip-type
      - name: Build check
        working-directory: ./extracted
        run: bash "$GITHUB_WORKSPACE/.github/ci/run.sh" zip-build-script
      - name: Summary
        run: |
          echo ""
          echo "============================================"
          echo "✅ 環境構築テスト完了"
          echo "============================================"
          echo "ZIP展開後、以下の手順で環境構築が可能です:"
          echo "1. unzip task-app.zip"
          echo "2. cp .env.example .env"
          echo "3. npm ci"
          echo "4. npx prisma generate"
          echo "5. docker compose up -d (DBが必要な場合)"
          echo "6. npm run dev"
          echo "============================================"
