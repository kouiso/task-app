name: ZIP Export & Environment Setup CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  zip-export:
    name: ZIP Export Test
    runs-on: ${{ vars.RUNNER_LINUX }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ZIP
        run: bash scripts/build-zip.sh

      - name: Verify ZIP exists
        run: |
          if [ ! -f task-app-curriculum-v1.1.zip ]; then
            echo "❌ ZIP file not created"
            exit 1
          fi
          echo "✅ ZIP file created successfully"
          ls -lh task-app-curriculum-v1.1.zip

      - name: Verify ZIP contents
        run: bash scripts/curriculum-qa/check-sale-package.sh task-app-curriculum-v1.1.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-app-zip
          path: task-app-curriculum-v1.1.zip
          retention-days: 1

  environment-setup:
    name: Environment Setup Test
    runs-on: ${{ vars.RUNNER_LINUX }}
    needs: zip-export
    env:
      COMPOSE_PROJECT_NAME: taskapp-zip-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task-app-zip
          path: ./artifact

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip artifact/task-app-curriculum-v1.1.zip -d extracted
          echo "✅ ZIP extracted successfully"

      - name: Setup tools with mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Setup Node.js (from starter contract)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './extracted/task-app/.node-version'
          package-manager-cache: false

      - name: Build current starter scaffold
        working-directory: ./extracted/task-app
        run: bash scripts/scaffold-from-scratch.sh

      - name: Type check
        working-directory: ./extracted/task-app
        run: npm run type-check

      - name: Build check
        working-directory: ./extracted/task-app
        run: npm run build

      - name: Stop owned database containers
        if: always()
        working-directory: ./extracted/task-app
        run: |
          if command -v docker >/dev/null 2>&1 && [ -f docker-compose.yml ]; then
            if ! docker info >/dev/null 2>&1; then
              echo "Docker CLI と docker-compose.yml はありますが、Docker daemon の状態を確認できません。所有コンテナを安全に停止できないため cleanup を失敗にします。" >&2
              exit 1
            fi
            node scripts/verify-scaffold-database.cjs preflight
            docker compose -p "$COMPOSE_PROJECT_NAME" --project-directory "$PWD" -f docker-compose.yml down --volumes --remove-orphans
          fi

      - name: Summary
        run: |
          echo ""
          echo "============================================"
          echo "✅ 環境構築テスト完了"
          echo "============================================"
          echo "販売用スターターZIPの展開、scaffold、型検査、本番buildが成功しました。"
          echo "============================================"
